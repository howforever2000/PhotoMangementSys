<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Accent glow gradient -->
    <radialGradient id="glow1" cx="70%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glow2" cx="30%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#7B68EE;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a8d8ea;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Camera icon gradient -->
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Photo frame pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  
  <!-- Glow overlays -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  
  <!-- Floating decorative shapes -->
  <!-- Top-left circle -->
  <circle cx="200" cy="150" r="120" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="150" r="80" fill="none" stroke="#7B68EE" stroke-width="0.8" opacity="0.12"/>
  
  <!-- Bottom-right circles -->
  <circle cx="1750" cy="950" r="150" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.1"/>
  <circle cx="1750" cy="950" r="100" fill="none" stroke="#7B68EE" stroke-width="0.8" opacity="0.08"/>
  
  <!-- Middle-right accent -->
  <circle cx="1600" cy="300" r="60" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.12"/>
  
  <!-- Scattered small dots / stars -->
  <circle cx="150" cy="900" r="3" fill="#00d2ff" opacity="0.2"/>
  <circle cx="300" cy="100" r="2" fill="#7B68EE" opacity="0.25"/>
  <circle cx="1800" cy="200" r="2.5" fill="#00d2ff" opacity="0.2"/>
  <circle cx="1000" cy="850" r="2" fill="#fff" opacity="0.15"/>
  <circle cx="500" cy="900" r="1.5" fill="#fff" opacity="0.1"/>
  <circle cx="1400" cy="150" r="2" fill="#7B68EE" opacity="0.18"/>
  
  <!-- Left side abstract photo frames -->
  <g transform="translate(120, 600)" opacity="0.08" filter="url(#glow)">
    <rect x="0" y="0" width="180" height="220" rx="12" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="15" y="15" width="150" height="110" rx="8" fill="rgba(255,255,255,0.03)"/>
    <rect x="15" y="135" width="150" height="70" rx="6" fill="rgba(255,255,255,0.02)"/>
  </g>
  
  <g transform="translate(280, 680) rotate(-12)" opacity="0.06" filter="url(#glow)">
    <rect x="0" y="0" width="140" height="170" rx="10" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
    <rect x="20" y="110" width="100" height="40" rx="5" fill="rgba(255,255,255,0.03)"/>
  </g>
  
  <!-- Right side overlapping frames -->
  <g transform="translate(1600, 550)" opacity="0.07" filter="url(#glow)">
    <rect x="0" y="0" width="160" height="200" rx="10" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <rect x="10" y="10" width="140" height="90" rx="6" fill="rgba(0,210,255,0.05)"/>
  </g>
  
  <g transform="translate(1650, 620) rotate(8)" opacity="0.05">
    <rect x="0" y="0" width="130" height="160" rx="8" fill="none" stroke="#7B68EE" stroke-width="1.5"/>
  </g>
  
  <!-- Camera Icon centered on right side -->
  <g transform="translate(1480, 280)" filter="url(#shadow)">
    <!-- Camera body -->
    <rect x="0" y="0" width="180" height="130" rx="20" fill="url(#camGrad)" opacity="0.9"/>
    <!-- Lens outer ring -->
    <circle cx="90" cy="65" r="40" fill="#0f0c29" opacity="0.6"/>
    <!-- Lens inner ring -->
    <circle cx="90" cy="65" r="28" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.8"/>
    <!-- Lens glass reflection -->
    <circle cx="90" cy="65" r="15" fill="#1a1a3e"/>
    <ellipse cx="82" cy="57" rx="6" ry="4" fill="rgba(255,255,255,0.3)" transform="rotate(-30 82 57)"/>
    <!-- Shutter button -->
    <circle cx="150" cy="15" r="6" fill="#ff6b6b" opacity="0.8"/>
    <!-- Flash indicator -->
    <rect x="12" y="10" width="20" height="8" rx="4" fill="#ffd93d" opacity="0.7"/>
  </g>
  
  <!-- Small floating camera silhouettes -->
  <g transform="translate(850, 180)" opacity="0.1">
    <rect x="0" y="0" width="60" height="40" rx="8" fill="url(#camGrad)"/>
    <circle cx="30" cy="20" r="12" fill="#0f0c29"/>
    <circle cx="30" cy="20" r="7" fill="none" stroke="#00d2ff" stroke-width="1"/>
  </g>
  
  <g transform="translate(1350, 600)" opacity="0.06">
    <rect x="0" y="0" width="45" height="30" rx="6" fill="url(#camGrad)"/>
    <circle cx="22" cy="15" r="9" fill="#0f0c29"/>
    <circle cx="22" cy="15" r="5" fill="none" stroke="#7B68EE" stroke-width="1"/>
  </g>
  
  <!-- Title text area -->
  <g transform="translate(960, 420)" filter="url(#shadow)">
    <!-- Main title shadow/outline -->
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="700" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="4">
      PhotoMangementSys
    </text>
    <!-- Main title -->
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="700" fill="url(#textGrad)">
      PhotoMangementSys
    </text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(960, 540)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="300" fill="rgba(255,255,255,0.7)">
      智能相册管理系统 · 让每一张照片都有家可归
    </text>
  </g>
  
  <!-- Decorative line under subtitle -->
  <line x1="810" y1="580" x2="1110" y2="580" stroke="url(#camGrad)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Feature badges -->
  <g transform="translate(660, 640)" filter="url(#glow)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="rgba(0,210,255,0.15)" stroke="#00d2ff" stroke-width="1" opacity="0.8"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#00d2ff" font-weight="500">📅 按时间排序</text>
  </g>
  
  <g transform="translate(850, 640)" filter="url(#glow)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="rgba(123,104,238,0.15)" stroke="#7B68EE" stroke-width="1" opacity="0.8"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#7B68EE" font-weight="500">📍 按地点分类</text>
  </g>
  
  <g transform="translate(1040, 640)" filter="url(#glow)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="rgba(0,210,255,0.15)" stroke="#00d2ff" stroke-width="1" opacity="0.8"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#00d2ff" font-weight="500">🤖 AI 识别标签</text>
  </g>
  
  <g transform="translate(1230, 640)" filter="url(#glow)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="rgba(123,104,238,0.15)" stroke="#7B68EE" stroke-width="1" opacity="0.8"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#7B68EE" font-weight="500">⚡ 本地化运行</text>
  </g>
  
  <!-- Bottom tagline -->
  <g transform="translate(960, 780)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="rgba(255,255,255,0.35)" letter-spacing="2">
      VUE + TAURI + RUST · POWERED BY AI
    </text>
  </g>
  
  <!-- Bottom subtle bar -->
  <rect x="0" y="1060" width="1920" height="20" fill="rgba(0,210,255,0.05)"/>
  <rect x="0" y="1075" width="1920" height="5" fill="url(#camGrad)" opacity="0.2"/>
</svg>
