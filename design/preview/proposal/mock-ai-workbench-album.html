<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>创意工坊相册 · 效果图</title>
<link rel="stylesheet" href="../../../src/assets/tokens.css" />
<style>
  :root{ --font:"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:var(--font); background:var(--c-bg);
    background-image:var(--wash-1),var(--wash-2); background-attachment:fixed;
    color:var(--c-fg); letter-spacing:.006em; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; }

  .topbar{ height:56px; display:flex; align-items:center; gap:18px; padding:0 var(--gutter);
    border-bottom:1px solid var(--c-rule); }
  .brand{ display:flex; align-items:center; gap:9px; font-size:var(--fs-title); font-weight:650; }
  .logo{ width:18px; height:18px; border-radius:5px; background:linear-gradient(135deg,#d4a24a,#8a5f22);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .nav{ display:flex; gap:22px; margin-left:8px; font-size:var(--fs-body); color:var(--c-fg-2); }
  .nav .on{ color:var(--c-fg); position:relative; }
  .nav .on::after{ content:""; position:absolute; left:0; right:0; bottom:-19px; height:1.5px;
    background:var(--c-accent); }
  .top-right{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .avatar{ width:26px; height:26px; border-radius:999px; background:linear-gradient(135deg,#5a6a86,#2b3448);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }

  .wrap{ padding:26px var(--gutter) 40px; }
  .crumb{ font-size:var(--fs-meta); color:var(--c-fg-3); margin-bottom:10px; }
  .crumb i{ font-style:normal; margin:0 6px; }

  .album-head{ display:flex; align-items:flex-end; gap:16px; margin-bottom:6px; }
  .album-head h1{ margin:0; font-size:var(--fs-display); letter-spacing:var(--ls-display); font-weight:650; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-meta); color:var(--c-accent);
    border:1px solid var(--c-accent); border-radius:999px; padding:3px 10px; margin-bottom:8px; }
  .album-stat{ font-size:var(--fs-body); color:var(--c-fg-2); display:flex; gap:10px; align-items:center; }
  .album-stat em{ font-style:normal; color:var(--c-fg-3); }
  .album-stat .sep{ color:var(--c-fg-3); }
  .map-note{ margin-top:8px; font-size:var(--fs-meta); color:var(--c-fg-3); }
  .map-note code{ font-family:var(--font); color:var(--c-fg-2); }

  .divider{ height:1px; background:var(--c-rule); margin:18px 0 18px; }

  .bar{ display:flex; align-items:center; gap:16px; margin-bottom:16px; font-size:var(--fs-body); color:var(--c-fg-2); }
  .bar .gh{ color:var(--c-fg-3); font-size:var(--fs-label); letter-spacing:var(--ls-label); text-transform:uppercase; font-weight:650; }
  .bar .seg{ margin-left:auto; display:flex; gap:2px; background:var(--slip-fill); border:1px solid var(--c-rule);
    border-radius:999px; padding:3px; }
  .bar .seg span{ font-size:var(--fs-meta); color:var(--c-fg-2); padding:5px 12px; border-radius:999px; }
  .bar .seg span.on{ background:var(--hover); color:var(--c-fg); }

  .grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .tile{ margin:0; }
  .thumb{ position:relative; aspect-ratio:1.5; border-radius:var(--r-cover); overflow:hidden;
    box-shadow:var(--cover-inset), var(--cover-topline); background:#15141a; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .warm{ filter:saturate(1.2) contrast(1.05) sepia(.08) brightness(1.04); }
  .ai{ position:absolute; left:6px; top:6px; font-size:9px; letter-spacing:.08em; font-weight:700;
    color:#221803; background:var(--c-accent); padding:2px 6px; border-radius:4px; }
  .cap{ padding-top:7px; font-size:var(--fs-meta); color:var(--c-fg-2); display:flex; align-items:baseline; gap:6px; }
  .cap em{ font-style:normal; color:var(--c-fg-3); }

  .toast{ position:fixed; right:22px; bottom:22px; display:flex; align-items:center; gap:10px;
    padding:11px 16px; border-radius:var(--r-ui); background:var(--float-fill);
    border:1px solid var(--float-border); box-shadow:var(--float-shadow);
    -webkit-backdrop-filter:blur(var(--float-blur)); backdrop-filter:blur(var(--float-blur));
    font-size:var(--fs-body); color:var(--c-fg); }
  .toast .ok{ width:18px; height:18px; border-radius:999px; background:var(--c-accent); color:#221803;
    display:grid; place-items:center; font-size:11px; font-weight:700; }
  .toast em{ font-style:normal; color:var(--c-fg-2); }
</style>
</head>
<body class="theme-dark">
  <header class="topbar">
    <div class="brand"><span class="logo"></span>本地相册搭子</div>
    <nav class="nav">
      <span class="on">相册</span><span>时间线</span><span>人物</span><span>创意工坊</span><span>搜索</span>
    </nav>
    <div class="top-right"><div class="avatar"></div></div>
  </header>

  <div class="wrap">
    <div class="crumb">相册 <i>/</i> 创意工坊</div>
    <div class="album-head">
      <h1>创意工坊</h1>
      <span class="pill">AI 修图产物</span>
    </div>
    <div class="album-stat">
      <span>128 张</span><span class="sep">·</span>
      <span>本次新增 12 张</span><span class="sep">·</span>
      <span>占用 1.8 GB</span><span class="sep">·</span>
      <span>2026-09 至今</span>
    </div>
    <div class="map-note">映射文件夹 <code>D:\Photos\创意工坊</code> · 修图成品写入该目录后自动入册，无需手动导入</div>

    <div class="divider"></div>

    <div class="bar">
      <span class="gh">全部照片</span>
      <span>按修改时间</span>
      <div class="seg"><span class="on">网格</span><span>单张</span></div>
    </div>

    <div class="grid">
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:40% 50%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2033_edit.jpg <em>新</em></figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:20% 40%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2034_edit.jpg <em>新</em></figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:70% 50%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2035_edit.jpg <em>新</em></figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:60% 60%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2037_edit.jpg <em>新</em></figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:55% 45%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2039_edit.jpg <em>新</em></figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:80% 30%"><span class="ai">AI</span></div><figcaption class="cap">IMG_2042_edit.jpg <em>新</em></figcaption></figure>

      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:50% 20%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1990_edit.jpg</figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:15% 70%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1988_edit.jpg</figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:35% 55%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1985_edit.jpg</figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:85% 55%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1981_edit.jpg</figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/cover.jpg" style="object-position:75% 70%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1977_edit.jpg</figcaption></figure>
      <figure class="tile"><div class="thumb"><img class="warm" src="../../../covers/login-sunset.jpg" style="object-position:30% 30%"><span class="ai">AI</span></div><figcaption class="cap">IMG_1972_edit.jpg</figcaption></figure>
    </div>
  </div>

  <div class="toast"><span class="ok">✓</span>本次修图的 12 张已自动导入《创意工坊》</div>
</body>
</html>
