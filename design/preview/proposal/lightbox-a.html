<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Lightbox · 方案 A</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1000px;overflow:hidden}
  body{
    font-family:"Noto Sans CJK SC","Noto Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#e8ebf2;
    background:radial-gradient(120% 90% at 50% 42%, #1b202c 0%, #0b0d13 55%, #05060a 100%);
  }
  .back{width:1600px;height:1000px;padding:34px;display:flex}

  /* ── 窗口 ───────────────────────────────────────────── */
  .win{
    flex:1;display:flex;flex-direction:column;overflow:hidden;
    background:#0d1016;border:1px solid rgba(255,255,255,.09);border-radius:16px;
    box-shadow:0 40px 110px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* ── 标题栏 46 ──────────────────────────────────────── */
  .tbar{
    height:46px;flex:0 0 46px;display:flex;align-items:center;gap:12px;
    padding:0 10px 0 18px;background:rgba(255,255,255,.025);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .tbar .dot{width:6px;height:6px;border-radius:50%;background:#6a8df0;box-shadow:0 0 10px #6a8df0}
  .fname{font-size:13px;font-weight:500;color:#eef1f7;letter-spacing:.1px}
  .fmeta{font-size:11.5px;color:#7d8598}
  .grow{flex:1}
  .counter{font-size:11.5px;color:#8b93a5;font-variant-numeric:tabular-nums;letter-spacing:.04em;
    padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.05)}
  .ico{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:#c9cfdb;background:transparent;
  }
  .ico:hover{background:rgba(255,255,255,.09)}
  .ico.close{color:#ffb4b4}
  .ico.close:hover{background:rgba(255,90,90,.16)}

  /* ── 主体 ───────────────────────────────────────────── */
  .body{flex:1;display:flex;min-height:0}

  /* 照片区 */
  .stage{
    flex:1;min-width:0;position:relative;display:grid;place-items:center;
    padding:22px 26px;background:#080a0e;
  }
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(80% 70% at 50% 50%, rgba(255,255,255,.03), transparent 70%);
  }
  .photo{
    width:100%;height:100%;max-height:100%;
    display:grid;place-items:center;
  }
  .photo svg{
    max-width:100%;max-height:100%;display:block;
    box-shadow:0 26px 70px rgba(0,0,0,.72);
  }

  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    color:#e9edf5;background:rgba(10,12,18,.5);
    border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);
  }
  .nav.l{left:20px}
  .nav.r{right:20px}

  /* ── 右侧信息栏 344 ─────────────────────────────────── */
  .meta{
    width:344px;flex:0 0 344px;padding:22px 22px 26px;overflow:hidden;
    border-left:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,0) 46%);
  }
  .m-date{font-size:21px;font-weight:600;letter-spacing:-.4px;color:#f4f6fa;line-height:1.2}
  .m-date em{font-style:normal;font-size:13px;font-weight:500;color:#98a1b3;margin-left:8px;letter-spacing:.02em}
  .m-place{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12.5px;color:#8fb0ff}
  .m-place svg{flex:0 0 auto}
  .m-path{margin-top:10px;font-size:10.5px;color:#5f6879;word-break:break-all;line-height:1.5}

  .sec{margin-top:22px}
  .sec-h{
    display:flex;align-items:center;gap:9px;margin-bottom:10px;
    font-size:9.5px;letter-spacing:.17em;color:#767f92;
  }
  .sec-h::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.07)}

  .params{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .p{
    padding:9px 11px 8px;border-radius:10px;background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.045);
  }
  .p b{display:block;font-size:15px;font-weight:600;color:#eef1f7;letter-spacing:-.2px;line-height:1.25}
  .p span{display:block;margin-top:1px;font-size:9.5px;letter-spacing:.14em;color:#788193}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:11.5px;line-height:1;padding:6px 10px;border-radius:999px;
    background:rgba(106,141,240,.13);color:#bdcbff;border:1px solid rgba(106,141,240,.24);
  }
  .chip.ghost{background:rgba(255,255,255,.055);color:#c6ccd9;border-color:rgba(255,255,255,.075)}

  .conf{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:#8b93a5}
  .conf .bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .conf .bar i{display:block;height:100%;width:92.4%;
    background:linear-gradient(90deg,#5b7ce0,#93b2ff)}
  .conf b{color:#dfe5f1;font-weight:600;font-variant-numeric:tabular-nums}

  .kv{display:grid;grid-template-columns:74px 1fr;gap:7px 10px;font-size:12px}
  .kv dt{color:#7d8598;font-size:11.5px}
  .kv dd{color:#dde2ec;font-variant-numeric:tabular-nums}

  .hist{
    height:74px;border-radius:9px;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.045);padding:6px;
  }
  .hist svg{width:100%;height:100%;display:block}
  .tone{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#8b93a5}
  .tone b{color:#dfe5f1;font-weight:600}

  /* ── 底部操作栏 60（与照片区完全分离，不压图）───────── */
  .dock{
    height:60px;flex:0 0 60px;display:flex;align-items:center;gap:6px;
    padding:0 14px;border-top:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.022);
  }
  .stars{display:flex;align-items:center;gap:2px;padding:0 4px}
  .star{font-size:17px;line-height:1;color:rgba(255,255,255,.2)}
  .star.on{color:#ffce3a}
  .rate{font-size:11px;color:#7d8598;margin-left:6px;min-width:38px}
  .sep{width:1px;height:20px;background:rgba(255,255,255,.09);margin:0 8px}
  .btn{
    height:34px;display:flex;align-items:center;gap:7px;padding:0 11px;
    border-radius:9px;font-size:12.5px;color:#d3d9e5;background:transparent;
  }
  .btn .cnt{font-size:10.5px;color:#8b93a5;background:rgba(255,255,255,.08);
    border-radius:5px;padding:1px 5px;margin-left:1px}
  .btn:hover{background:rgba(255,255,255,.07)}
  .btn.danger{color:#ff9d9d}
  .btn.danger:hover{background:rgba(255,90,90,.14)}
  .btn.pri{background:rgba(106,141,240,.14);color:#c3d0ff;border:1px solid rgba(106,141,240,.26)}
  .spacer{flex:1}
  .scalechip{
    font-size:11px;color:#aab3c4;font-variant-numeric:tabular-nums;
    padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.05);
  }
</style>
</head>
<body>
<div class="back">
  <div class="win">

    <!-- 标题栏 -->
    <div class="tbar">
      <span class="dot"></span>
      <span class="fname">IMG_2043.ARW</span>
      <span class="fmeta">洱海 · 2026-10-28</span>
      <span class="grow"></span>
      <span class="counter">12 / 348</span>
      <div class="ico" title="信息">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </div>
      <div class="ico" title="全屏">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg>
      </div>

    </div>

    <!-- 主体 -->
    <div class="body">
      <div class="stage">
        <div class="photo">
          <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

              <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">

                <stop offset=".22" stop-color="#7c5347"/>
                <stop offset=".62" stop-color="#2b2430"/>
                <stop offset="1" stop-color="#14131c"/>
              </linearGradient>

              </linearGradient>
              <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
            </defs>

            <rect width="1200" height="800" fill="url(#sky)"/>
            <ellipse cx="745" cy="452" rx="330" ry="210" fill="url(#sunGlow)"/>
            <circle cx="745" cy="440" r="34" fill="#ffeec2"/>

            <!-- 云带 -->
            <g opacity=".5" filter="url(#soft)">
              <ellipse cx="300" cy="250" rx="290" ry="26" fill="#6b5560"/>
              <ellipse cx="880" cy="180" rx="330" ry="20" fill="#57455c"/>
              <ellipse cx="560" cy="330" rx="380" ry="18" fill="#a06a5e"/>
            </g>

            <!-- 远山 -->
            <path d="M0 470 L120 418 L230 452 L330 402 L430 448 L520 424 L640 462 L760 430 L880 456 L980 420 L1100 458 L1200 432 L1200 500 L0 500 Z" fill="url(#mtFar)" opacity=".85"/>

            <!-- 水面 -->
            <rect y="500" width="1200" height="300" fill="url(#water)"/>

            <g>
              <ellipse cx="745" cy="500" rx="105" ry="9" fill="#ffd79a" opacity=".55"/>
              <ellipse cx="745" cy="530" rx="72" ry="5" fill="#ffcf90" opacity=".38"/>

            <g stroke="#e8c9a4" stroke-width="1" opacity=".15">
              <path d="M120 556 H420"/><path d="M180 590 H360"/><path d="M60 620 H300"/>
              <path d="M860 566 H1120"/><path d="M900 606 H1060"/><path d="M840 646 H1160"/>
              <path d="M420 700 H760"/><path d="M300 740 H620"/>
            </g>
            <!-- 岸线 -->
            <path d="M0 780 C180 760 300 792 470 776 C640 760 820 790 1000 772 L1200 782 L1200 800 L0 800 Z" fill="#0b0a12" opacity=".92"/>
          </svg>
        </div>

        <div class="nav l">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </div>
        <div class="nav r">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>

      <!-- 信息栏 -->
      <aside class="meta">
        <div class="m-date">2026 · 10 · 28<em>17:42</em></div>
        <div class="m-place">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          云南省 大理市 · 洱海生态廊道
        </div>
        <div class="m-path">/home/hao/Pictures/2026/10/大理/IMG_2043.ARW</div>

        <div class="sec">
          <div class="sec-h">相机</div>
          <div class="params">
            <div class="p"><b>1/500 s</b><span>快门</span></div>
            <div class="p"><b>f / 8.0</b><span>光圈</span></div>
            <div class="p"><b>ISO 100</b><span>感光度</span></div>
            <div class="p"><b>35 mm</b><span>焦距</span></div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-h">AI 识别</div>
          <div class="chips">
            <span class="chip">风景 · 山湖</span>
            <span class="chip ghost">日落</span>
            <span class="chip ghost">湖面</span>
            <span class="chip ghost">逆光</span>
          </div>
          <div class="conf">
            <span>置信度</span>
            <span class="bar"><i></i></span>
            <b>92.4%</b>
          </div>
        </div>

        <div class="sec">
          <div class="sec-h">文件</div>
          <dl class="kv">
            <dt>分辨率</dt><dd>6000 × 4000 · 24.0 MP</dd>
            <dt>大小</dt><dd>24.6 MB</dd>
            <dt>格式</dt><dd>ARW（RAW）</dd>
          </dl>
        </div>

        <div class="sec">
          <div class="sec-h">像素分布</div>
          <div class="hist">
            <svg viewBox="0 0 300 74" preserveAspectRatio="none">
              <g fill="none" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round">
                <polyline stroke="#ff6b6b" opacity=".85"
                  points="0,72 8,69 16,60 24,52 32,44 40,39 48,35 56,31 64,28 72,26 80,24 88,25 96,29 104,33 112,36 120,40 128,45 136,50 144,54 152,58 160,62 168,64 176,66 184,62 192,55 200,48 208,42 216,38 224,35 232,33 240,36 248,41 256,47 264,54 272,61 280,67 288,70 300,72"/>
                <polyline stroke="#4ade80" opacity=".7"
                  points="0,72 8,71 16,64 24,57 32,49 40,44 48,40 56,36 64,32 72,29 80,27 88,28 96,32 104,37 112,41 120,45 128,50 136,56 144,61 152,65 160,68 168,70 176,71 184,68 192,62 200,55 208,48 216,43 224,39 232,37 240,40 248,46 256,53 264,60 272,66 280,70 288,72 300,72"/>
                <polyline stroke="#60a5fa" opacity=".8"
                  points="0,72 8,71 16,67 24,61 32,54 40,49 48,45 56,41 64,37 72,33 80,30 88,29 96,33 104,39 112,44 120,48 128,53 136,59 144,64 152,67 160,70 168,71 176,72 184,70 192,65 200,59 208,53 216,47 224,43 232,40 240,43 248,49 256,56 264,63 272,68 280,71 288,72 300,72"/>
              </g>
            </svg>
          </div>
          <div class="tone"><span>暖调</span><span>平均亮度 <b>118.4</b></span></div>
        </div>
      </aside>
    </div>

    <!-- 底部操作栏 -->
    <div class="dock">
      <div class="stars">
        <span class="star on">★</span><span class="star on">★</span><span class="star on">★</span>
        <span class="star on">★</span><span class="star">★</span>
        <span class="rate">4 星</span>
      </div>
      <span class="sep"></span>
      <div class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0l-7.2-7.2V4h9.4l7.8 7.8a2 2 0 010 1.6z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
        标签<span class="cnt">3</span>
      </div>
      <div class="btn pri">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        编辑
      </div>
      <div class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>

      <div class="spacer"></div>

      <div class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2 3h6l2-3h4"/><path d="M5 5h14l2 8v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4z"/></svg>
        归档
      </div>
      <div class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        隐藏
      </div>
      <div class="btn danger">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        删除
      </div>
    </div>
  </div>
</div>
</body>
</html>
